name: cd

on:
  push:
    branches: ["main"]

  env:
    DATABASE_URL: "${{ secrets.DATABASE_URL }}"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build prod code for notely
        run: ./scripts/buildprod.sh

      - name: Run migration
        run: ./scripts/migrateup.sh

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI
        run: gcloud builds submit --tag asia-south1-docker.pkg.dev/notely-504811/notely-ar-repo/notely:latest .

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image asia-south1-docker.pkg.dev/notely-504811/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-504811 --max-instances=4
